name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python (core + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      # Tests run against FakeProvider/NoopTracer (core) and the real demo
      # MCP subprocess (backend) — no network calls, no API keys needed.
      - run: uv run pytest

  frontend:
    name: Frontend (chat-mvp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chat-mvp/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chat-mvp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
