[project]
name = "chat-mvp-backend"
version = "0.1.0"
description = "build4galileo chat MVP — FastAPI backend + demo MCP server"
requires-python = ">=3.11"
dependencies = [
    "b4g-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.1.0",
    "httpx2>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
b4g-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]
